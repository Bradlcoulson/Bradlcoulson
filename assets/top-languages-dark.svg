<svg xmlns="http://www.w3.org/2000/svg" width="550" height="366" viewBox="0 0 550 366" role="img" aria-labelledby="title description">
  <title id="title">Top languages across repositories</title>
  <desc id="description">Language proportions based on GitHub repository byte counts.</desc>
  <style>
    text { font: 14px -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif; }
    .heading { font-size: 18px; font-weight: 600; }
    .percentage { font-size: 12px; }
  </style>
  <rect width="550" height="366" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="24" y="34" fill="#e6edf3" class="heading">Languages across repositories</text>
  <text x="24" y="81" fill="#e6edf3">TypeScript</text>
  <rect x="150" y="68" width="300" height="12" rx="6" fill="#30363d"/>
  <rect x="150" y="68" width="132.68" height="12" rx="6" fill="#3178c6"/>
  <text x="526" y="81" text-anchor="end" fill="#8b949e" class="percentage">44.2%</text>
  <text x="24" y="115" fill="#e6edf3">Astro</text>
  <rect x="150" y="102" width="300" height="12" rx="6" fill="#30363d"/>
  <rect x="150" y="102" width="65.79" height="12" rx="6" fill="#D83333"/>
  <text x="526" y="115" text-anchor="end" fill="#8b949e" class="percentage">21.9%</text>
  <text x="24" y="149" fill="#e6edf3">Vue</text>
  <rect x="150" y="136" width="300" height="12" rx="6" fill="#30363d"/>
  <rect x="150" y="136" width="59.76" height="12" rx="6" fill="#41b883"/>
  <text x="526" y="149" text-anchor="end" fill="#8b949e" class="percentage">19.9%</text>
  <text x="24" y="183" fill="#e6edf3">Swift</text>
  <rect x="150" y="170" width="300" height="12" rx="6" fill="#30363d"/>
  <rect x="150" y="170" width="14.83" height="12" rx="6" fill="#F05138"/>
  <text x="526" y="183" text-anchor="end" fill="#8b949e" class="percentage">4.9%</text>
  <text x="24" y="217" fill="#e6edf3">SCSS</text>
  <rect x="150" y="204" width="300" height="12" rx="6" fill="#30363d"/>
  <rect x="150" y="204" width="11.49" height="12" rx="6" fill="#cc6699"/>
  <text x="526" y="217" text-anchor="end" fill="#8b949e" class="percentage">3.8%</text>
  <text x="24" y="251" fill="#e6edf3">CSS</text>
  <rect x="150" y="238" width="300" height="12" rx="6" fill="#30363d"/>
  <rect x="150" y="238" width="7.91" height="12" rx="6" fill="#663399"/>
  <text x="526" y="251" text-anchor="end" fill="#8b949e" class="percentage">2.6%</text>
  <text x="24" y="285" fill="#e6edf3">JavaScript</text>
  <rect x="150" y="272" width="300" height="12" rx="6" fill="#30363d"/>
  <rect x="150" y="272" width="4.42" height="12" rx="6" fill="#f1e05a"/>
  <text x="526" y="285" text-anchor="end" fill="#8b949e" class="percentage">1.5%</text>
  <text x="24" y="319" fill="#e6edf3">HTML</text>
  <rect x="150" y="306" width="300" height="12" rx="6" fill="#30363d"/>
  <rect x="150" y="306" width="2.80" height="12" rx="6" fill="#e34c26"/>
  <text x="526" y="319" text-anchor="end" fill="#8b949e" class="percentage">0.9%</text>
